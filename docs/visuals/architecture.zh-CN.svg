</g><g id="host-execution"><path d="M480 698 L480 758" fill="none" stroke="#62518C" stroke-width="3"/><path d="M-13 -8 L0 0 L-13 8" transform="translate(480 758) rotate(90.0)" fill="none" stroke="#62518C" stroke-width="3"/><text x="48" y="812" font-size="30" font-weight="500" fill="#62518C" text-anchor="start" data-readability="supporting" class="" style="fill:#62518C">宿主 agent 与产品</text>
