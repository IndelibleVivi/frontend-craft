<path d="M355 1247 L524 1247" fill="none" stroke="#62518C" stroke-width="3" stroke-dasharray="9 7"/><path d="M-13 -8 L0 0 L-13 8" transform="translate(524 1247) rotate(0.0)" fill="none" stroke="#62518C" stroke-width="3"/><text x="542" y="1130" font-size="40" font-weight="600" fill="#493E68" text-anchor="start" data-readability="body" class="" style="fill:#493E68">Cloudflare</text>
