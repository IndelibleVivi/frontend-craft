<text x="542" y="1226" font-size="35" font-weight="400" fill="#493E68" text-anchor="start" data-readability="body" class="" style="fill:#493E68">+ Vectorize</text>
<text x="542" y="1299" font-size="35" font-weight="400" fill="#685A76" text-anchor="start" data-readability="body" class="" style="fill:#685A76">派生索引</text>
<text x="48" y="1352" font-size="35" font-weight="500" fill="#493E68" text-anchor="start" data-readability="body" class="" style="fill:#493E68">仅经授权的案例文本与查询可传出。</text>
<text x="48" y="1399" font-size="35" font-weight="400" fill="#493E68" text-anchor="start" data-readability="body" class="" style="fill:#493E68">当前上下文与证据指针留在本地。</text>
