<title id="title">Frontend Craft — architecture</title>
<desc id="desc">The current request, accepted design and repository/runtime guide a host agent using one skill router. Focused methods guide product changes and rendered checks. Optional local records can support that work; an explicitly authorized Cloudflare index is derived state, never the canonical context.</desc>
